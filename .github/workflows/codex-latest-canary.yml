name: Codex latest compatibility canary

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Codex latest canary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Use bash for npm scripts on Windows
        if: runner.os == 'Windows'
        run: npm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Install dependencies
        run: npm ci

      - name: Install latest Codex CLI
        run: npm install -g @openai/codex@latest

      - name: Report Codex CLI version
        run: codex --version

      # This workflow is intentionally advisory and build-only: the generated
      # app-server types are the repository's Codex-version-dependent surface;
      # tests use fake CLIs and add no compatibility signal for @latest. These
      # commands bypass npm run build, whose npm-script PATH selects the pinned
      # devDependency by design.
      - name: Generate app-server types with latest Codex
        run: codex app-server generate-ts --out plugins/codex/.generated/app-server-types

      - name: Type-check generated compatibility surface
        run: npx --no-install tsc -p tsconfig.app-server.json
