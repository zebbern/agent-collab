name: Upstream watch

# The codex plugin is a fork of openai/codex-plugin-cc pinned at v1.0.6.
# Upstream keeps moving and does not carry this fork's fixes, so drift is
# silent. This weekly check counts upstream commits past the fork point and
# keeps a single labeled issue up to date so rebasing is a choice, not a
# surprise.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Compare against upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The current upstream base lives in a committed pin so a rebase
          # updates it in the same commit and the drift count stays honest.
          FORK_POINT=$(tr -d '[:space:]' < .github/upstream-base)
          git remote add upstream https://github.com/openai/codex-plugin-cc.git
          git fetch --quiet upstream main

          HEAD_SHA=$(git rev-parse upstream/main)
          COUNT=$(git rev-list --count "$FORK_POINT..upstream/main")
          echo "Upstream is $COUNT commit(s) past the pinned base (HEAD $HEAD_SHA)."

          if [ "$COUNT" -eq 0 ]; then
            # Drift resolved (or never existed): close any stale tracking issue.
            OPEN=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number // empty')
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --comment "Upstream is no longer ahead of the pinned base ($(tr -d '[:space:]' < .github/upstream-base | cut -c1-7)); closing."
            fi
            exit 0
          fi

          # The tracking label is bootstrapped here so the workflow carries its
          # own setup instead of depending on manual repo configuration.
          gh label create upstream-sync --description "Upstream codex-plugin-cc has moved past the fork point" --color 1D76DB --force

          SHORT=${HEAD_SHA:0:7}
          TITLE="Upstream codex-plugin-cc: $COUNT commits past the fork point (through $SHORT)"

          {
            echo "Upstream [openai/codex-plugin-cc](https://github.com/openai/codex-plugin-cc) has moved **$COUNT commit(s)** past this fork's pinned base (\`${FORK_POINT:0:7}\`)."
            echo
            echo "After rebasing, update \`.github/upstream-base\` to the new base SHA in the same commit — the next run will then close this issue automatically."
            echo
            echo "### Latest upstream commits"
            echo '```'
            git log --oneline --no-decorate -20 "$FORK_POINT..upstream/main"
            echo '```'
            echo
            echo "### Files upstream touched"
            echo '```'
            git diff --stat=110 "$FORK_POINT" upstream/main -- ':!tests' | tail -25
            echo '```'
            echo
            echo "Review whether any of it should be rebased into \`plugins/codex\`. This issue is updated automatically by the \`upstream-watch\` workflow."
          } > body.md

          EXISTING=$(gh issue list --label upstream-sync --state open --json number,title --jq '.[0] // empty')
          if [ -z "$EXISTING" ]; then
            gh issue create --label upstream-sync --title "$TITLE" --body-file body.md
            exit 0
          fi

          EXISTING_NUMBER=$(echo "$EXISTING" | jq -r '.number')
          EXISTING_TITLE=$(echo "$EXISTING" | jq -r '.title')
          if [ "$EXISTING_TITLE" = "$TITLE" ]; then
            echo "Open issue #$EXISTING_NUMBER already reflects $SHORT."
            exit 0
          fi
          gh issue edit "$EXISTING_NUMBER" --title "$TITLE" --body-file body.md
