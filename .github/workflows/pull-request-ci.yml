name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite spawns real processes and is slow on Windows. The former
    # 15-minute tests/runtime.test.mjs is split into runtime-core, runtime-task,
    # and runtime-broker (~4-5 minutes of test time each) so the test runner's
    # per-file parallelism absorbs most of it, but the budget stays generous.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history: tests/bench-manifest.test.mjs verifies historical fix/parent
          # SHAs (the resurrection bench archaeology) and skips on shallow clones.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      # npm scripts default to cmd.exe on Windows, which breaks the POSIX
      # bits in this repo's scripts (mkdir -p in prebuild, glob quoting).
      - name: Use bash for npm scripts on Windows
        if: runner.os == 'Windows'
        run: npm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Install dependencies
        run: npm ci

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run test suite
        run: npm test

      - name: Run build
        run: npm run build

  # Advisory floor check: engines claims >=20, so one leg actually runs it.
  ci-node-floor:
    name: CI (ubuntu-latest, node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history: tests/bench-manifest.test.mjs verifies historical fix/parent
          # SHAs (the resurrection bench archaeology) and skips on shallow clones.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run test suite
        run: npm test
