name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite spawns real processes and takes ~30 minutes on Windows
    # (tests/runtime.test.mjs alone is ~15), so the budget is generous.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      # npm scripts default to cmd.exe on Windows, which breaks the POSIX
      # bits in this repo's scripts (mkdir -p in prebuild, glob quoting).
      - name: Use bash for npm scripts on Windows
        if: runner.os == 'Windows'
        run: npm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Install dependencies
        run: npm ci

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run test suite
        run: npm test

      - name: Run build
        run: npm run build
